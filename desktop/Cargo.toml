[package]
name = "tessera-desktop"
version = "0.1.0"
description = "Native desktop home for the Tessera harness"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tessera-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
