[project]
name = "tessera"
version = "0.1.0"
description = "A small, generic agent harness with summary-tree memory and harness-owned capture"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.scripts]
tessera = "tessera.terminal:main"

[project.optional-dependencies]
mac-cua = ["pyobjc-framework-Quartz>=10"]
test = ["pytest>=8", "pygments>=2.11", "setuptools>=77"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tessera"]

[tool.setuptools.package-data]
tessera = ["native/*.py", "native/mac/*.swift"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
