name: release

# On a tag, build the native desktop shell for every platform and architecture
# the installer supports, rename each bundle to the canonical
# `tessera-<platform>-<arch>.<ext>` name the downloader derives, emit a `.sha256`
# sidecar for each, create the GitHub release when it is absent, and attach all
# artifacts. This is the automatic-install source: `tessera start` resolves the
# exact bundle URL, verifies it against the sidecar, and installs it.
on:
  push:
    tags: ['v*']

jobs:
  linux:
    name: linux (x86_64 + aarch64 AppImage)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libfuse2t64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build x86_64 AppImage
        working-directory: desktop
        run: cargo tauri build --bundles appimage --target x86_64-unknown-linux-gnu
      - name: Build aarch64 AppImage
        working-directory: desktop
        run: cargo tauri build --bundles appimage --target aarch64-unknown-linux-gnu
      - name: Assemble canonical artifacts and sidecars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A names=( [x86_64]="tessera-linux-x86_64.AppImage" [aarch64]="tessera-linux-aarch64.AppImage" )
          for arch in x86_64 aarch64; do
            src=$(ls desktop/target/$arch/release/bundle/appimage/*.AppImage)
            cp "$src" "dist/${names[$arch]}"
          done
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tessera-linux
          path: dist/**

  macos:
    name: macos (aarch64 .app)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build .app
        working-directory: desktop
        run: cargo tauri build --bundles app
      - name: Assemble canonical artifact and sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          app=$(ls desktop/target/release/bundle/macos/*.app | head -1)
          tar -C "$(dirname "$app")" -czf dist/tessera-macos-aarch64.app.tar.gz "$(basename "$app")"
          (cd dist && sha256sum tessera-macos-aarch64.app.tar.gz > tessera-macos-aarch64.app.tar.gz.sha256)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tessera-macos
          path: dist/**

  windows:
    name: windows (x86_64 .msi)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build MSI
        working-directory: desktop
        run: cargo tauri build --bundles msi
      - name: Assemble canonical artifact and sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp desktop/target/release/bundle/msi/*.msi dist/tessera-windows-x86_64.msi
          (cd dist && sha256sum tessera-windows-x86_64.msi > tessera-windows-x86_64.msi.sha256)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tessera-windows
          path: dist/**

  publish:
    name: create release and attach assets
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release if absent, then attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/* --clobber