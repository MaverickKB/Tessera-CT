[project]
name = "aethermind"
version = "0.3.0"
description = "Project-local append-only continuity layers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AetherMind Noncommercial Public License"}
authors = [{name = "AetherMind contributors"}]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp==1.27.1"]
test = ["pytest>=8"]

[project.scripts]
aethermind = "aethermind.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]

[tool.pytest.ini_options]
testpaths = ["lib/tests"]
pythonpath = ["lib"]
